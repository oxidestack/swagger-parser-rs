name: Bug report
description: A result that differs from swagger-parser's, a panic, or an error where swagger-parser succeeds.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for the report. A question rather than a bug belongs in
        [Discussions](https://github.com/oxidestack/swagger-parser-rs/discussions/categories/q-a), and a vulnerability
        in a [private report](https://github.com/oxidestack/swagger-parser-rs/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: The crate's version (from Cargo.lock), or the commit you build from.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: rustc
    attributes:
      label: Rust toolchain
      description: The output of `rustc -V`, and the target if it is not the host's.
  - type: textarea
    id: code
    attributes:
      label: The code
      description: The smallest Rust program or test that shows it.
      render: rust
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The input
      description: The OpenAPI or Swagger document and the parse options, if the code above does not hold it.
      render: yaml
  - type: textarea
    id: result
    attributes:
      label: The result
      description: What the crate returned, or the error or the panic with its backtrace (`RUST_BACKTRACE=1`).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: >-
        What swagger-parser 2.1.48 answers to the same input, if you can run it: a difference from swagger-parser is the
        most useful report there is.
    validations:
      required: true
