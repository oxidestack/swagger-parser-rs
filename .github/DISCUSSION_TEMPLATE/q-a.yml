body:
  - type: markdown
    attributes:
      value: >-
        A bug — a result that differs from swagger-parser's, a panic — belongs in an
        [issue](https://github.com/oxidestack/swagger-parser-rs/issues/new/choose).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The crate's version or commit, if it matters to the question.
